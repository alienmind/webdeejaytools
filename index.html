<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Locks the renderer down to its own origin. The only remote host permitted is the streaming
      services' cover-art CDNs, which are loaded as images. Fonts are self-hosted (see
      src/client/fonts.css), so no external stylesheet host is needed at all.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>WebDeeJayTools - DJ Automation & Sync Suite</title>
    <meta name="description" content="Local DJ workflow automation suite for Qobuz and Spotify playlist conversion, audio downloading, and metadata tagging." />
    <meta name="theme-color" content="#090d16" />
  </head>
  <body class="bg-[#090d16] text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
